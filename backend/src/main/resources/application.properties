spring.application.name=backend

# .env 파일에서 환경변수 불러오기
spring.config.import=optional:file:.env[.properties]

# MySQL 연결 설정
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# batchUpdate를 한 번에 보낸다. 없으면 줄마다 DB를 왕복해, 회원 한 명 재판정(혜택 약 1만 건 결과 저장)이
# 원격 공용 DB에서는 크게 느려진다. batchUpdate 결과 행 수를 쓰는 코드는 없다
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# DB 테이블 자동 변경 방지
spring.jpa.hibernate.ddl-auto=none

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800000

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope[0]=profile_nickname
spring.security.oauth2.client.registration.kakao.scope[1]=account_email
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# Kakao OAuth2 Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth 완료 후 프론트 이동 주소. 실제 정적 서버 URL은 환경변수로 설정한다.
app.oauth.frontend.home-url=${OAUTH_FRONTEND_HOME_URL:http://localhost:63342/bokdeongi/frontend/index.html}
# 위 홈 URL의 Origin만 허용한다. 요청값으로는 리다이렉트 대상을 만들지 않는다.
app.oauth.frontend.allowed-origins=${OAUTH_FRONTEND_ALLOWED_ORIGINS:http://localhost:63342}

spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}

jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Swagger UI에서 CSRF 토큰 자동 전송
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# 소득 및 민감정보 컬럼 암호화 키
app.encryption.key=${FIELD_ENCRYPTION_KEY}

# 민감정보 수집 및 이용 동의 문서 버전
app.consent.terms-version=v1.0
app.consent.privacy-version=v1.0
app.consent.sensitive-version=v1.0
app.consent.optional-info-version=v1.0

# Spring Security 디버깅용 (필요할 때만 활성화)
# logging.level.org.springframework.security=TRACE

# 공공서비스 API 동기화 (DATA-01). 공용 DB에 쓰므로 배포 서버 한 곳에서만 켠다 (기본은 꺼짐)
app.gov24.service-key=${DATA_GO_KR_SERVICE_KEY:}
app.sync.enabled=${SYNC_ENABLED:false}
app.sync.run-on-startup=${SYNC_RUN_ON_STARTUP:false}

# Spring AI - Gemini (EASY-01 쉬운 말, DATA-03 조건 추출)
# 키가 있는 사람만 .env에 GEMINI_API_KEY와 AI_CHAT_MODEL=google-genai 두 줄을 넣는다.
# 없으면(기본 none) LLM 기능만 꺼지고 서버는 그대로 뜬다. 쉬운 말은 FAILED → 화면에는 원문만
# 무료 한도는 키가 아니라 구글 프로젝트 단위(하루 20회 공유)라 각자 자기 프로젝트 키를 쓴다 (D-92·D-93)
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
# Gemini 3는 temperature 기본값(1.0) 권장이라 지정하지 않는다 (D-97)
# 생각 수준: 3.x는 LOW. 2.5 계열은 생각 수준을 지원하지 않아 THINKING_LEVEL_UNSPECIFIED로 바꾼다 (D-97)
spring.ai.google.genai.chat.thinking-level=${GEMINI_THINKING_LEVEL:LOW}
# 무료 한도를 아끼려고 실패해도 자동 재시도하지 않는다
spring.ai.retry.max-attempts=1

# DATA-03 조건 추출: 쉼표로 구분한 서비스ID가 있을 때만 서버 시작 직후 한 번 돈다 (정답셋·시연 페르소나 혜택만, D-93)
# 기본은 B가 검수할 CSV만 review-dir에 쓰고 DB는 바꾸지 않는다. save=true면 benefit_rules(source = LLM)에 저장한다 (D-99)
# 돌린 뒤에는 service-ids를 비운다
app.conditions.service-ids=${CONDITIONS_SERVICE_IDS:}
app.conditions.save=${CONDITIONS_SAVE:false}
app.conditions.review-dir=${CONDITIONS_REVIEW_DIR:conditions-review}
# EASY-01 시연 공고 쉬운 말 미리 만들기: 서비스ID를 쉼표로. 서버 시작 직후 한 번 돌고, 돌린 뒤에는 비운다 (D-09)
app.easy.service-ids=${EASY_SERVICE_IDS:}
