<!doctype html>
<html lang="ko">
<head>
    <link rel="icon" type="image/png" href="img/복덩이_로고.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>복덩이 | 복지 혜택 찾기</title>
    <meta name="description" content="검색어와 조건으로 필요한 복지 혜택을 찾아보세요.">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/benefit-list.css">
    <script src="./js/common-ui.js" defer></script>
    <script src="./js/auth-config.local.js" defer></script>
    <script src="./js/auth.js" defer></script>
    <script src="./js/benefit-list.js" defer></script>
</head>
<body class="benefit-list-page">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="site-brand" href="./index.html" aria-label="복덩이 홈">
                <img class="site-brand__mark" src="./img/복덩이_로고.png" alt="복덩이 캐릭터 로고">
                <span class="site-brand__text"><strong>복덩이</strong></span>
            </a>
            <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="site-nav" id="site-navigation" aria-label="주요 메뉴">
                <a class="site-nav__link" href="./index.html">홈</a>
                <a class="site-nav__link is-active" href="benefit-list.html" aria-current="page">복지 혜택 찾기</a>
                <a class="site-nav__link" href="benefit-recommend.html">맞춤 혜택 추천</a>
                <a class="site-nav__link" href="application-status.html">신청 현황</a>
                <a class="site-nav__link" href="./easy-translator.html">쉬운 말 번역기</a>
                <a class="site-nav__link" href="./my-page.html" hidden>마이페이지</a>
                <span class="mobile-auth-links">
                    <a href="login.html">로그인</a>
                <a href="./signup-account.html">회원가입</a>
                </span>
            </nav>
            <div class="header-tools" aria-label="화면 설정">
                <button class="header-tool" type="button" data-font-size="decrease" aria-label="글자 크기 줄이기" title="글자 크기 줄이기">-</button>
                <button class="header-tool" type="button" data-font-size="increase" aria-label="글자 크기 키우기" title="글자 크기 키우기">+</button>
                <button class="header-tool header-tool--theme" type="button" data-theme-toggle aria-pressed="false">다크 모드</button>
                <div class="auth-links" aria-label="인증 메뉴">
                    <a href="login.html">로그인</a>
                <a class="auth-links__signup" href="./signup-account.html">회원가입</a>
                </div>
            </div>
        </div>
    </header>
    <main id="main-content">
        <section class="container benefit-search-hero" aria-labelledby="page-title">
            <div class="benefit-search-hero__copy">
                <p class="breadcrumb">홈 <span aria-hidden="true">›</span> 복지 혜택 찾기</p>
                <h1 id="page-title">복지 혜택 찾기</h1>
                <p>나에게 필요한 복지 혜택을 쉽고 빠르게 찾아보세요.</p>
            </div>
            <div class="benefit-search-hero__search">
                <form id="benefit-search-form" class="search-form" novalidate>
                    <label class="sr-only" for="benefit-search-input">복지 혜택 검색어</label>
                    <span class="search-form__icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></span>
                    <input id="benefit-search-input" type="search" placeholder="어떤 복지 혜택을 찾고 계신가요?" autocomplete="off">
                    <button class="bk-btn bk-btn--primary bk-btn--lg search-form__button" type="submit">검색하기</button>
                </form>
                <p id="search-message" class="search-message" role="alert" aria-live="polite"></p>
                <div id="hashtag-suggestions" class="suggested-keywords" aria-label="추천 해시태그" aria-live="polite"></div>
            </div>
        </section>
        <section class="container benefit-content" aria-label="복지 혜택 검색">
            <aside class="filter-panel card" aria-labelledby="filter-title">
                <div class="filter-panel__heading">
                    <h2 id="filter-title">필터</h2>
                    <button id="filter-reset" class="bk-btn bk-btn--tertiary bk-btn--sm text-button" type="button"><span aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M20 11a8 8 0 1 0 2 5.5"></path><path d="M20 4v7h-7"></path></svg></span>초기화</button>
                </div>
                <div id="filter-groups"></div>
            </aside>
            <section class="benefit-results" aria-live="polite" aria-atomic="true">
                <div class="result-controls">
                    <p id="result-summary">검색어 또는 조건을 선택해 혜택을 찾아보세요.</p>
                    <div class="sort-control">
                        <label class="sort-select" for="sort-order">
                            <span class="sr-only">정렬 기준</span>
                            <select id="sort-order">
                                <option value="relevance">관련도순</option>
                                <option value="deadline">마감 임박순</option>
                                <option value="amount">지원 금액순</option>
                                <option value="easy">신청 쉬운 순</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div id="result-area"></div>
            </section>
        </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
