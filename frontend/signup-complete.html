<!doctype html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>복덩이 | 회원가입 완료</title>
    <meta name="description" content="복덩이 회원가입이 완료되었습니다.">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/signup-account.css">
    <link rel="stylesheet" href="./css/signup-complete.css">
    <script src="./js/signup-complete.js" defer></script>
</head>
<body class="signup-account-page">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="site-brand" href="./index.html" aria-label="복덩이 홈"><span class="site-brand__mark" aria-hidden="true">☘</span><span class="site-brand__text"><strong>복덩이</strong></span></a>
            <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-navigation"><span></span><span></span><span></span></button>
            <nav class="site-nav" id="site-navigation" aria-label="주요 메뉴">
                <a class="site-nav__link" href="./index.html">홈</a><a class="site-nav__link" href="benefit-list.html">복지 혜택 찾기</a><a class="site-nav__link" href="benefit-recommend.html">맞춤 혜택 추천</a><a class="site-nav__link" href="application-status.html">신청 현황</a><a class="site-nav__link" href="easy-translator.html">쉬운 말 번역기</a><a class="site-nav__link" href="my-page.html">마이페이지</a>
                <span class="mobile-auth-links"><a href="login.html">로그인</a><a href="signup-account.html" aria-current="page">회원가입</a></span>
            </nav>
            <div class="header-tools" aria-label="화면 설정">
                <button class="header-tool" type="button" data-font-size="decrease" aria-label="글자 크기 줄이기">가-</button><button class="header-tool" type="button" data-font-size="increase" aria-label="글자 크기 키우기">가+</button><button class="header-tool header-tool--theme" type="button" data-theme-toggle aria-pressed="false">다크 모드</button>
                <div class="auth-links" aria-label="인증 메뉴"><a href="login.html">로그인</a><a class="auth-links__signup" href="signup-account.html" aria-current="page">회원가입</a></div>
            </div>
        </div>
    </header>

    <main id="main-content" class="container signup-account">
        <div class="signup-account__shell signup-complete__shell">
            <section id="signup-complete-content" class="signup-account__card signup-complete__card card" aria-labelledby="signup-complete-title" hidden>
                <ol class="signup-steps" aria-label="회원가입 진행 단계">
                    <li class="signup-step is-complete"><span aria-label="1단계 완료">✓</span><strong>계정 정보</strong></li><li class="signup-step is-complete"><span aria-label="2단계 완료">✓</span><strong>약관 동의</strong></li><li class="signup-step is-complete"><span aria-label="3단계 완료">✓</span><strong>프로필 입력</strong></li><li class="signup-step is-current" aria-current="step"><span aria-label="4단계 가입 완료">4</span><strong>가입 완료</strong></li>
                </ol>
                <div class="signup-complete__message">
                    <span class="signup-complete__check" aria-hidden="true">✓</span>
                    <h1 id="signup-complete-title">복덩이 가입을 축하드려요!</h1>
                    <p>이제 복덩이에서 나에게 맞는 복지 혜택을 찾아보세요.</p>
                    <a class="btn signup-account__submit signup-complete__home" href="index.html">홈으로 이동 <span aria-hidden="true">›</span></a>
                </div>
            </section>
        </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
