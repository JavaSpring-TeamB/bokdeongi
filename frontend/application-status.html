<!doctype html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>복덩이 | 신청 현황</title>
    <meta name="description" content="신청한 복지 서비스의 진행 상태와 처리 결과를 확인하세요.">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/assist-eligibility.css">
    <link rel="stylesheet" href="./css/application-status.css">
    <script src="./js/common-ui.js" defer></script>
    <script src="./js/application-status.js" defer></script>
</head>
<body class="application-status-page">
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>

    <header class="site-header">
        <div class="container site-header__inner">
            <a class="site-brand" href="./index.html" aria-label="복덩이 홈">
                <img class="site-brand__mark" src="./img/복덩이_로고.png" alt="복덩이 캐릭터 로고">
                <span class="site-brand__text"><strong>복덩이</strong></span>
            </a>
            <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-navigation">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav" id="site-navigation" aria-label="주요 메뉴">
                <a class="site-nav__link" href="./index.html">홈</a>
                <a class="site-nav__link" href="benefit-list.html">복지 혜택 찾기</a>
                <a class="site-nav__link" href="benefit-recommend.html">맞춤 혜택 추천</a>
                <a class="site-nav__link is-active" href="application-status.html" aria-current="page">신청 현황</a>
                <a class="site-nav__link" href="./easy-translator.html">쉬운 말 번역기</a>
                <a class="site-nav__link" href="./my-page.html">마이페이지</a>
                <span class="mobile-auth-links">
                    <a href="login.html">로그인</a>
                <a href="./signup-account.html">회원가입</a>
                </span>
            </nav>
            <div class="header-tools" aria-label="화면 설정">
                <button class="header-tool" type="button" data-font-size="decrease" aria-label="글자 크기 줄이기" title="글자 크기 줄이기">-</button>
                <button class="header-tool" type="button" data-font-size="increase" aria-label="글자 크기 키우기" title="글자 크기 키우기">+</button>
                <button class="header-tool header-tool--theme" type="button" data-theme-toggle aria-pressed="false">다크 모드</button>
                <div class="auth-links" aria-label="인증 메뉴">
                    <a href="login.html">로그인</a>
                <a class="auth-links__signup" href="./signup-account.html">회원가입</a>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="container application-status-content">
        <section class="application-status-banner" aria-labelledby="application-status-title">
            <div class="application-status-banner__copy">
                <h1 id="application-status-title">신청 현황</h1>
                <p>신청한 복지 서비스의 진행 상태와 처리 결과를 한눈에 확인하세요.</p>
            </div>
            <dl class="application-status-summary" aria-label="신청 상태 요약">
                <div><dt>진행 중</dt><dd data-summary-count="in-progress">0건</dd></div>
                <div><dt>준비 중</dt><dd data-summary-count="preparing">0건</dd></div>
                <div><dt>완료</dt><dd data-summary-count="completed">0건</dd></div>
            </dl>
        </section>

        <div class="application-status-controls">
            <div class="application-status-tabs" role="tablist" aria-label="신청 상태별 목록">
                <button id="all-tab" class="application-status-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="application-list" data-status-tab="all">전체 <span data-tab-count="all"></span></button>
                <button id="in-progress-tab" class="application-status-tab" type="button" role="tab" aria-selected="false" aria-controls="application-list" data-status-tab="in-progress">진행 중 <span data-tab-count="in-progress"></span></button>
                <button id="preparing-tab" class="application-status-tab" type="button" role="tab" aria-selected="false" aria-controls="application-list" data-status-tab="preparing">준비 중 <span data-tab-count="preparing"></span></button>
                <button id="completed-tab" class="application-status-tab" type="button" role="tab" aria-selected="false" aria-controls="application-list" data-status-tab="completed">완료 <span data-tab-count="completed"></span></button>
            </div>
            <button class="bk-btn bk-btn--secondary bk-btn--sm application-calendar-button" type="button" data-calendar-save><span aria-hidden="true">□</span> 일정 저장</button>
        </div>

        <section id="application-list" class="application-list" role="tabpanel" aria-labelledby="all-tab" aria-live="polite">
            <h2 class="sr-only">신청 목록</h2>
            <div data-application-list></div>
            <div data-application-pagination></div>
        </section>

        <aside class="application-data-notice">
            <strong aria-hidden="true">i</strong>
            <span><b>공고 정보 기준 시각: <time datetime="2026-03-10T06:00">2026.03.10 06:00</time></b></span>
            <span>공고 내용은 수시로 변경될 수 있으니, 상세 화면에서 최신 정보를 확인해 주세요.</span>
        </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
