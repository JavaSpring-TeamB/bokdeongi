name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    name: backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # 백엔드 담당이 Spring Boot 프로젝트를 만들기 전에는 건너뛴다
      - name: Check backend project exists
        id: exists
        working-directory: .
        run: |
          if [ -f backend/gradlew ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "backend/gradlew 없음 — 백엔드 빌드를 건너뜀"
          fi

      - uses: actions/setup-java@v6
        if: steps.exists.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/**/gradle-wrapper.properties

      - name: Build and test
        if: steps.exists.outputs.found == 'true'
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  secrets-guard:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo ".env 파일이 커밋됐습니다. 삭제하고 키를 재발급하세요."
            exit 1
          fi
